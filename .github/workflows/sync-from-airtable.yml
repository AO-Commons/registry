# Regenerates data/ from the Airtable registry base.
#
# INERT until you set the repository variable SYNC_ENABLED to 'true' and add
# the AIRTABLE_TOKEN secret. The gate is deliberate: a half-configured sync
# that writes empty files is worse than one that doesn't run.
#
# See scripts/README.md for the setup steps.

name: Sync from Airtable

on:
  schedule:
    - cron: "0 6 * * *" # daily, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    if: vars.SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install jsonschema pyyaml requests

      - name: Regenerate data/ from Airtable
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ vars.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_ID: ${{ vars.AIRTABLE_TABLE_ID }}
        run: python3 scripts/sync_from_airtable.py

      - name: Validate the regenerated data
        run: python3 scripts/validate.py

      # A PR rather than a direct push: a sync that drops every record should
      # need a human to notice before it lands on main.
      - name: Open a pull request with the changes
        uses: peter-evans/create-pull-request@v6
        with:
          branch: sync/airtable
          title: "Sync registry data from Airtable"
          commit-message: "Sync registry data from Airtable"
          body: |
            Generated by the scheduled Airtable sync. Review the diff —
            particularly any removed records — before merging.
          labels: sync
          delete-branch: true
