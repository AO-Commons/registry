schema_version: '0.1'
id: paperclip
name: Paperclip
summary: An open-source Node.js and React application for orchestrating teams of AI agents
  against business goals, with org charts, per-agent budgets, and approval gates. Users bring
  their own agents from any provider.
website: https://paperclip.ing
status: active
launched: '2026-03-02'
categories:
- governance
- observability
- orchestration
agent_model: Agents are managed workers arranged in an org chart — described as employees
  that wake on scheduled "heartbeats", execute assigned work, and go dormant between runs.
  They do not set direction or hold budget authority; the documentation places humans in the
  role of the board of directors.
human_controls: Human approval required before an agent is hired and before an agent executes
  a strategy. Per-agent and per-project budgets that auto-pause execution when limits are
  hit. Any agent can be paused, resumed, overridden, reassigned, or terminated. Full run transcripts
  and per-agent cost tracking.
