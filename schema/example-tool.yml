schema_version: "0.1"
id: example-orchestrator
name: Example Orchestrator
aliases:
  - ExOrch
summary: >-
  An open-source server for running teams of AI agents against assigned work,
  with per-agent budgets and an approval step before any agent acts outside
  its brief.
website: https://example.dev
status: active
launched: 2025-11
categories:
  - orchestration
  - observability

agent_model: >-
  Agents are managed workers: a human assigns goals and the platform schedules
  agents against them. Agents do not hold budget authority or set direction.
human_controls: >-
  Per-agent spending caps that pause execution when reached, human approval
  required before an agent acts outside its assigned brief, and a full
  transcript of every run.

maintainer: Example Labs
